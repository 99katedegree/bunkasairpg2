name: Deploy API to Fly.io

# api/ に変更が入って main に push されたときだけ動く。
# モノレポなので web/ や schema/ だけの変更ではトリガーしない。
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-api-group
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        # Dockerfile / fly.toml は api/.deploy/ にあるが、ビルドコンテキストは
        # api/ に保つため、実行ディレクトリは api/ のままパスだけ明示する。
        working-directory: api
        run: flyctl deploy --remote-only --config .deploy/fly.toml --dockerfile .deploy/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
