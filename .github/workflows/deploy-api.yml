name: Deploy API to Fly.io

# api/ に変更が入って main に push されたときに動く。
# モノレポなので web/ や schema/ だけの変更ではトリガーしない。
# workflow_dispatch は Actions 画面から手動で再実行したいときのため。
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-api-group
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        # fly.toml は api/.deploy/ にあるが、ビルドコンテキストは api/ に保つため
        # 実行ディレクトリは api/ のまま --config だけ渡す。dockerfile のパスは
        # fly.toml 側（.deploy/ からの相対）で解決されるので指定しない。
        working-directory: api
        run: flyctl deploy --remote-only --config .deploy/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
