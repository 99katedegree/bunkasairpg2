version: "2"
sql:
  - engine: "mysql"
    queries: "internal/infrastructure/db/query"
    schema: "migrations"
    gen:
      go:
        package: "dbgen"
        out: "internal/infrastructure/db/sqlc"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: true
        emit_db_tags: true
